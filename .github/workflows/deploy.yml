name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The differential unit tests diff the ports against the ORIGINAL apps
      # read off disk, resolving `../../../<app>/…` — siblings of the
      # workspace. Without these clones `npm test` dies with ENOENT before
      # running anything. See ci.yml for why they are cloned rather than
      # vendored.
      - name: Clone the legacy apps the differentials diff against
        run: |
          for repo in recall Hooklabs blast pulse; do
            git clone --depth 1 "https://github.com/mjmorrison10/$repo" "../$repo"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The e2e suite runs BEFORE the deploy build, not after: it is the only
      # thing that exercises the React wiring, and Pages has no staging step to
      # catch a regression later. `test:e2e` builds and previews its own copy
      # at the real base path.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
